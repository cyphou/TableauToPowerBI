<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">Migration workflow at a glance</title>
  <desc id="features-desc">Extract Tableau metadata, convert formulas, generate editable projects, run locally, review quality evidence and publish separately with authorization.</desc>
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#122550"/>
    </linearGradient>
    <linearGradient id="f-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="f-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="f-glow"><feGaussianBlur in="SourceGraphic" stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="100" rx="12" fill="url(#f-bg)"/>

  <!-- Card 1 -->
  <g transform="translate(16, 14)">
    <rect width="185" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="34" cy="36" r="16" fill="#E97627" opacity="0.15"/>
    <circle cx="34" cy="36" r="8" fill="#E97627" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#FFBE76" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="34" r="7"/><path d="m37 39 6 6"/></g>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">Tableau metadata</text>
    <text x="60" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">23 object types</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(214, 14)">
    <rect width="185" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="34" cy="36" r="16" fill="#8764B8" opacity="0.15"/>
    <circle cx="34" cy="36" r="8" fill="#8764B8" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#CFB5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m29 29-6 7 6 7m10-14 6 7-6 7m-3-16-4 18"/></g>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">DAX + M</text>
    <text x="60" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">Review conversions</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(412, 14)">
    <rect width="185" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="34" cy="36" r="16" fill="#038387" opacity="0.15"/>
    <circle cx="34" cy="36" r="8" fill="#038387" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#7FE0D8" stroke-width="2" stroke-linejoin="round"><rect x="23" y="25" width="22" height="22" rx="3"/><path d="M23 32h22M29 43v-5m5 5V35m5 8v-9"/></g>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">PBIR + TMDL</text>
    <text x="60" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">Editable projects</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(610, 14)">
    <rect width="185" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="34" cy="36" r="16" fill="#0078D4" opacity="0.15"/>
    <circle cx="34" cy="36" r="8" fill="#0078D4" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#8BD5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="26" width="24" height="20" rx="3"/><path d="M22 32h24m-18 6 3 3-3 3m8 0h5"/></g>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">Browser + CLI</text>
    <text x="60" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">Local folders</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(808, 14)">
    <rect width="185" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="34" cy="36" r="16" fill="#107C10" opacity="0.15"/>
    <circle cx="34" cy="36" r="8" fill="#107C10" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#A5E2B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M27 25h13l4 4v18H24V25zm13 0v6h4M29 36h10m-10 5h8"/></g>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">Quality evidence</text>
    <text x="60" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">Static / runtime states</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(1006, 14)">
    <rect width="178" height="72" rx="10" fill="url(#f-glass)" stroke="url(#f-border)" stroke-width="1"/>
    <circle cx="32" cy="36" r="16" fill="#E97627" opacity="0.15"/>
    <circle cx="32" cy="36" r="8" fill="#E97627" opacity="0.15" filter="url(#f-glow)"/>
    <g fill="none" stroke="#FFBE76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 38v9h20v-9m-10 3V25m-7 7 7-7 7 7"/></g>
    <text x="58" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="white">Separate publish</text>
    <text x="58" y="50" font-family="Segoe UI, sans-serif" font-size="11" fill="#B9CBE3">Authorized access</text>
  </g>
</svg>
